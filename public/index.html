<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深圳实验学校光明部电视台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ============================================================
       Layer 1 — BrandHeader (min-height: 100vh)
       ============================================================ -->
  <section id="brand-header" class="section-brand min-h-screen flex items-center justify-center relative overflow-hidden px-6 py-16 md:py-24">
    <!-- Background blobs (natural-organic organic shapes) -->
    <div class="blob blob-1 absolute top-[-10%] left-[-5%] w-[40vw] h-[40vw] max-w-[500px] max-h-[500px] bg-[#e9e0d4]/40" data-parallax="0.02"></div>
    <div class="blob blob-2 absolute bottom-[-8%] right-[-5%] w-[35vw] h-[35vw] max-w-[400px] max-h-[400px] bg-[#8b9d77]/15" data-parallax="-0.03"></div>

    <div class="text-center relative z-10" data-scroll>
      <img src="/logo.png" alt="深圳实验学校光明部电视台" class="mx-auto w-28 md:w-36 mb-6 rounded-full shadow-sm" />
      <p class="font-serif text-base md:text-lg text-[#5c4033] tracking-wide mb-2">
        深圳实验学校光明部
      </p>
      <h1 class="font-serif text-3xl md:text-4xl lg:text-5xl tracking-wide">
        <span style="color:#5c4033">拾光电视台</span><span style="color:#fab22a">SGTVS</span>
      </h1>
      <p class="font-sans text-stone-500 text-sm md:text-base mt-4 tracking-wider">
        记录校园点滴 · 传播青春声音
      </p>
    </div>

    <!-- Floating leaves decorations -->
    <svg class="leaf animate-leaf absolute top-[15%] left-[8%] w-10 md:w-14 opacity-30" viewBox="0 0 50 50" data-parallax="0.04">
      <path d="M25 4 C38 12 44 30 25 46 C6 30 12 12 25 4Z" fill="#78716c" />
    </svg>
    <svg class="leaf animate-leaf-1 absolute top-[20%] right-[8%] w-12 md:w-16 opacity-25" viewBox="0 0 50 50" data-parallax="-0.03">
      <path d="M25 6 C40 14 46 32 25 44 C4 32 10 14 25 6Z" fill="#d4a373" />
    </svg>
    <svg class="leaf animate-leaf-2 absolute bottom-[15%] left-[15%] w-8 md:w-10 opacity-20" viewBox="0 0 50 50" data-parallax="0.05">
      <path d="M25 2 C32 10 38 28 25 48 C12 28 18 10 25 2Z" fill="#8b9d77" />
    </svg>
    <svg class="leaf animate-leaf absolute bottom-[20%] right-[18%] w-9 md:w-12 opacity-20" viewBox="0 0 50 50" data-parallax="-0.04">
      <path d="M25 4 C38 12 44 30 25 46 C6 30 12 12 25 4Z" fill="#d4a373" />
    </svg>
  </section>

  <!-- ============================================================
       Layer 2 — MemberGallery (min-height: 100vh)
       ============================================================ -->
  <section id="member-gallery" class="section-members min-h-screen relative overflow-hidden px-6 py-16 md:py-20">
    <div class="max-w-6xl mx-auto relative z-10">
      <h2 class="font-serif text-3xl md:text-4xl text-[#5c4033] text-center mb-4" data-scroll>
        此处
      </h2>
      <p class="font-sans text-stone-500 text-sm md:text-base text-center mb-10" data-scroll>
        关于我们
      </p>

      <!-- Palette swatches (color bar reference from showcase) -->
      <div class="palette-bar flex justify-center gap-2 mb-10" data-scroll>
        <span class="palette-swatch w-8 h-8 rounded-full" style="background-color:#5c4033" title="Deep Earth"></span>
        <span class="palette-swatch w-8 h-8 rounded-full" style="background-color:#8b9d77" title="Sage Green"></span>
        <span class="palette-swatch w-8 h-8 rounded-full" style="background-color:#d4a373" title="Warm Tan"></span>
        <span class="palette-swatch w-8 h-8 rounded-full" style="background-color:#e9e0d4" title="Linen"></span>
        <span class="palette-swatch w-8 h-8 rounded-full" style="background-color:#faf6f1" title="Warm Cream"></span>
      </div>

      <div id="members-grid" class="members-grid">
      </div>
    </div>

    <!-- Floating dots decorations -->
    <div class="dot-decoration animate-dot w-20 h-20 md:w-28 md:h-28 bg-emerald-400/20 -top-4 right-[8%]" data-parallax="0.03"></div>
    <div class="dot-decoration animate-dot-1 w-16 h-16 md:w-24 md:h-24 bg-amber-500/20 bottom-[10%] left-[5%]" data-parallax="-0.02"></div>
    <div class="dot-decoration animate-dot-2 w-14 h-14 md:w-20 md:h-20 bg-stone-400/20 top-[40%] right-[3%]" data-parallax="0.04"></div>
    <div class="dot-decoration animate-dot-3 w-10 h-10 md:w-16 md:h-16 bg-emerald-600/15 bottom-[30%] right-[15%]" data-parallax="-0.03"></div>
    <div class="dot-decoration animate-dot w-12 h-12 md:w-18 md:h-18 bg-[#d4a373]/20 top-[60%] left-[4%]" data-parallax="0.02"></div>
  </section>

  <!-- ============================================================
       Layer 3 — Timeline (min-height: 100vh)
       ============================================================ -->
  <section id="timeline-section" class="section-timeline min-h-screen relative overflow-hidden px-6 py-16 md:py-20">
    <div class="max-w-5xl mx-auto relative z-10">
      <h2 class="font-serif text-3xl md:text-4xl text-[#5c4033] text-center mb-4" data-scroll>
        彼时
      </h2>
      <p class="font-sans text-stone-500 text-sm md:text-base text-center mb-12" data-scroll>
        瞬间即永恒·大型活动帧选
      </p>
      <div id="timeline-container" class="timeline-container">
      </div>
    </div>

    <!-- Vine decorations -->
    <div class="vine-decoration animate-vine w-24 h-32 md:w-32 md:h-40 top-[10%] left-[2%]" data-parallax="0.02"></div>
    <div class="vine-decoration animate-vine-1 w-20 h-28 md:w-28 md:h-36 bottom-[15%] right-[3%]" data-parallax="-0.02" style="transform: scaleX(-1);"></div>
  </section>

  <!-- ============================================================
       Layer 4 — JoinUs (min-height: 100vh)
       ============================================================ -->
  <section id="join-us" class="section-join min-h-screen relative overflow-hidden px-6 py-16 md:py-20 flex items-center">
    <!-- Decorative blobs -->
    <div class="blob absolute top-[5%] right-[-10%] w-[35vw] h-[35vw] max-w-[400px] max-h-[400px] bg-[#e9e0d4]/30" data-parallax="0.02"></div>
    <div class="blob blob-2 absolute bottom-[-5%] left-[-8%] w-[30vw] h-[30vw] max-w-[350px] max-h-[350px] bg-[#8b9d77]/10" data-parallax="-0.03"></div>

    <!-- Floating leaves -->
    <svg class="leaf animate-leaf absolute top-[12%] left-[5%] w-8 md:w-12 opacity-25" viewBox="0 0 50 50" data-parallax="0.03">
      <path d="M25 4 C38 12 44 30 25 46 C6 30 12 12 25 4Z" fill="#8b9d77" />
    </svg>
    <svg class="leaf animate-leaf-2 absolute top-[25%] right-[6%] w-6 md:w-10 opacity-20" viewBox="0 0 50 50" data-parallax="-0.02">
      <path d="M25 2 C32 10 38 28 25 48 C12 28 18 10 25 2Z" fill="#d4a373" />
    </svg>
    <svg class="leaf animate-leaf-1 absolute bottom-[20%] left-[10%] w-7 md:w-11 opacity-20" viewBox="0 0 50 50" data-parallax="0.04">
      <path d="M25 6 C40 14 46 32 25 44 C4 32 10 14 25 6Z" fill="#78716c" />
    </svg>

    <!-- Floating dots -->
    <div class="dot-decoration animate-dot-2 w-16 h-16 md:w-20 md:h-20 bg-[#8b9d77]/15 top-[15%] left-[12%]" data-parallax="0.03"></div>
    <div class="dot-decoration animate-dot-3 w-10 h-10 md:w-14 md:h-14 bg-[#d4a373]/20 bottom-[30%] right-[10%]" data-parallax="-0.02"></div>

    <!-- Vine decoration -->
    <div class="vine-decoration animate-vine w-20 h-28 md:w-28 md:h-36 bottom-[5%] right-[2%]" data-parallax="0.02" style="transform: scaleX(-1);"></div>

    <div class="max-w-4xl mx-auto text-center relative z-10">
      <h2 class="font-serif text-3xl md:text-4xl text-[#5c4033] mb-4" data-scroll>
        原点
      </h2>
      <p class="font-sans text-stone-500 text-sm md:text-base mb-8" data-scroll>
        驻留·不止此处
      </p>

      <!-- Contact cards (rendered by JS) -->
      <div id="contact-cards" class="contact-cards-grid" data-scroll></div>

      <!-- Department badges (showcase style) -->
      <div class="flex flex-wrap justify-center gap-3 mb-8" data-scroll>
        <span class="badge">摄影</span>
        <span class="badge">主持</span>
        <span class="badge">编导</span>
        <span class="badge">后期</span>
        <span class="badge">新媒体</span>
      </div>

      <div class="join-card max-w-xl mx-auto p-8" data-scroll>
        <p class="font-sans text-stone-700 text-base md:text-lg leading-relaxed mb-4">
          你是否对视频创作充满热情？是否渴望在校园中留下自己的影像印记？
        </p>
        <p class="font-sans text-stone-600 text-sm md:text-base leading-relaxed mb-8">
          深圳实验学校光明部电视台面向全校招募新成员！无论你擅长摄影、主持、编导还是后期，
          这里都有属于你的舞台。和我们一起，用镜头记录青春，用画面讲述故事。
        </p>
        <a href="#" class="join-cta inline-block text-base md:text-lg">
          立即加入
        </a>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">已复制</div>

    <!-- Wave decorations -->
    <div class="wave-decoration animate-wave" aria-hidden="true">
      <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style="width:100%;height:100%;">
        <path d="M0,30 C360,0 720,60 1080,30 C1260,15 1350,35 1440,25 L1440,60 L0,60Z" fill="#8b9d77" opacity="0.2" />
      </svg>
    </div>
    <div class="wave-decoration animate-wave-1" aria-hidden="true" style="bottom: 8px;">
      <svg viewBox="0 0 1440 60" preserveAspectRatio="none" style="width:100%;height:100%;">
        <path d="M0,40 C240,60 480,10 720,35 C960,60 1200,20 1440,30 L1440,60 L0,60Z" fill="#d4a373" opacity="0.15" />
      </svg>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-[#5c4033] text-stone-400 py-8 px-6 text-center text-sm">
    <p class="font-sans">&copy; 2026 凛光工作室 &middot; LL</p>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
